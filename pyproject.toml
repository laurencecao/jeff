[project]
name = "jev-clf"
version = "0.1.0"
description = "An independent, decision-only fact-checking model — a local Jev replacement"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11.0",
    "transformers>=4.57.0",
    "peft>=0.14.0",
    "accelerate>=1.0.0",
    "datasets>=4.0.0",
    "scikit-learn>=1.7.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "typesafe-sdk>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_clf"]
