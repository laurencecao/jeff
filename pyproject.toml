[project]
name = "jeff"
version = "1.0.0"
description = "Jeff 1 — an independent, local typed decision / fact-checking model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11.0",
    "transformers>=4.57.0",
    "peft>=0.14.0",
    "accelerate>=1.0.0",
    "datasets>=4.0.0",
    "scikit-learn>=1.7.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "typesafe-sdk>=0.6.0",
    "fastapi>=0.141.1",
    "matplotlib>=3.10.2",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_clf"]
