# jev_clf LoRA arm — RETRAIN: all three primitives.
#
# Hypothesis: the 4B arm is accurate on Choice (test 0.774) but its Noul and
# Score outputs are untrained. All six existing training schemas are Choice; the
# Noul schemas were held out entirely for the agreement metric and Score was
# never generated. Measured consequence: our Score output is uniform
# (0.25 per level) with no signal, while Jev returns a real graded answer.
#
# ONE VARIABLE vs the 4B baseline arm: the training file now includes
# teacher-labelled Noul and Score rows (scripts/jev_clf_multiprimitive_data.py)
# on top of the identical Choice data. Base model, LoRA shape, optimiser,
# schedule, seed and prompt contract are unchanged.
#
# The multiprimitive rows use NEW schema wordings (no-a0/1, sc-a0/1/2) that
# cannot collide with the held-out agreement schemas (fc-c1/c2/n0/n1).

# --- model -----------------------------------------------------------------
model: Qwen/Qwen3-4B-Instruct-2507
dtype: bfloat16
max_length: 2048
gradient_checkpointing: true

# --- LoRA ------------------------------------------------------------------
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

# --- optimization ----------------------------------------------------------
optim:
  lr: 0.0001
  weight_decay: 0.0
  epochs: 2
  batch_size: 4                     # 4B: keep logits over 152k vocab inside 40GB
  grad_accum: 8                     # effective batch = 32, same as baseline
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  seed: 42
  soft_target_weight: 1.0

# --- data ------------------------------------------------------------------
data:
  # sft_train.jsonl (9119 Choice rows) + sft_multi.jsonl (Noul/Score rows),
  # concatenated by scripts/jev_clf_sft_data.py --merge.
  train: data/factcheck/sft_train_multi.jsonl
  val: data/factcheck/sft_val.jsonl
  prompt_format: eval
  completion_leading_space: true
  label_source_weights: {}

# --- output ----------------------------------------------------------------
out_dir: artifacts/jev_clf/lora_4b_soft
mlflow:
  uri: http://127.0.0.1:5001
  experiment: jev-clf
  run_name: jev-clf-lora-4b-soft