# jev_clf OptionScorer — RETRAIN: real LM encoder + normalization fix + all three
# primitives.
#
# Hypothesis: the option-scorer architecture gives Jev's single-pass property
# (measured: 18.3ms at k=1, 52.2ms at k=16, sub-linear — 59x faster than the
# autoregressive readout at k=8 and ~18x faster than live Jev), but its 0.49
# accuracy came from TWO defects, not from the architecture:
#   1. a FROZEN sentence-similarity encoder (all-MiniLM-L6-v2) that never encoded
#      claim/evidence relations — the wrong tool, established earlier;
#   2. NO input normalization on the head, so a larger encoder's hidden states
#      (absmax ~220 vs MiniLM's ~6) saturate the attention logits at init and
#      predictions pin at exactly 1/N.
#
# This run fixes both: a real language-model encoder (Qwen2.5-0.5B, the smallest
# that is an actual LM) and LayerNorm on the head input.
#
# Data: all 12,119 rows (9119 Choice + 1200 Noul + 1800 Score), so all three of
# Jev's primitives are covered, not just Choice.
#
# ONE VARIABLE vs the original OptionScorer arm: encoder + normalization. Data,
# LoRA/head shape, optimiser, schedule, seed and prompt contract are unchanged.
#
# IMPORTANT: this model is NOT comparable to the 0.794/0.8143 autoregressive
# numbers until it has its own held-out eval — different architecture, different
# encoder. Measure, then compare.

# --- model -----------------------------------------------------------------
encoder_name: Qwen/Qwen2.5-0.5B
freeze_encoder: true
head_width: 256
heads: 4
dropout: 0.1
normalize_head_input: true      # THE FIX: LayerNorm on the head input
max_length: 32768
seed: 42
device: auto
calibration: temperature

# --- optimisation ----------------------------------------------------------
optim:
  lr: 0.0003                    # higher than the AR head: the head is small and frozen-backbone
  weight_decay: 0.01
  epochs: 3
  batch_size: 1
  warmup_ratio: 0.03
  patience: 3
  max_grad_norm: 1.0

# --- data ------------------------------------------------------------------
data:
  train_files:
    - data/factcheck/sft_train_multi_state.jsonl
  val_files:
    - data/factcheck/sft_val_state.jsonl
  label_source_weights: {}

# --- output ----------------------------------------------------------------
out_dir: artifacts/jev_clf/option_scorer_32k
mlflow:
  uri: http://127.0.0.1:5001
  experiment: jev-clf
  run_name: jev-clf-option-scorer-lm
