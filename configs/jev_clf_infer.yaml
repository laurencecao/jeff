# Tunable decision rule for the jeff Jev replacement.
#
# THIS FILE IS THE AUTORESEARCH LOOP'S EDITABLE SURFACE (along with scripts/
# and jeff/). NOTE: the autoresearch session's discard/rollback acts on the
# SESSION repo, not on this one — experimental edits here must be reverted by
# hand when a run is discarded.
#
# The posterior over labels is built in probability space:
#     ensemble over wordings -> p ** (1/temperature) -> p * label_bias -> norm
#
# Levers:
#   ensemble_schemas  average the label distribution over question wordings.
#                     TESTED: hurts badly (accuracy -3 rows, agreement
#                     0.769 -> 0.374). Left off.
#   temperature       >1 softens the posterior; changes ECE, not argmax.
#   label_bias        multiplicative prior correction. TESTED by offline sweep
#                     over the val probabilities: identity is optimal, every
#                     other combination LOSES a row. So the over-claiming
#                     `supported` errors are confidently wrong, not a threshold
#                     artefact, and cannot be fixed post-hoc.
#   adapter           which trained adapter to evaluate (for retrain A/Bs).
#
# Retraining is NOT expressible here: it needs a Colab run and must be a
# deliberate experiment.

readout: first_token        # first_token | sequence (readout is fixed in code)
max_length: 2048
temperature: 1.0
label_bias:
  supported: 1.0
  refuted: 1.0
  not_enough_info: 1.0
ensemble_schemas: false
adapter: artifacts/jeff/lora_4b   # 4B retrain (capacity hypothesis)
base_model: Qwen/Qwen3-4B-Instruct-2507   # must match the adapter's base
